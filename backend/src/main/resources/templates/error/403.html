<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 card bank-card shadow-lg" style="max-width: 540px;">
        <div class="text-danger mb-3">
            <i class="bi bi-shield-lock-fill" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">403</h1>
        <h4 class="fw-bold text-secondary mb-3">Access Denied / Forbidden</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to access the requested banking resource.'}">
            You do not have permission to access this resource.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-box-arrow-in-right me-1"></i> Switch User
            </a>
        </div>
    </div>
</body>
</html>
