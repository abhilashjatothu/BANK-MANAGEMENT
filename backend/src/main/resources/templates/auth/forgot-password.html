<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Apex Bank</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-bg">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card login-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
                            <i class="bi bi-shield-lock fs-1 text-warning"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Reset Password</h3>
                        <p class="text-muted small">Verify your registered credentials to set a new password</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center mb-3" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-2 fs-6"></i>
                        <span th:text="${errorMessage}">Unable to reset password.</span>
                    </div>

                    <!-- Forgot Password Form -->
                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold text-secondary">Username *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" id="username" th:field="*{username}" class="form-control border-start-0" 
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" 
                                       placeholder="Enter your username" required autofocus>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">Registered Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" 
                                       placeholder="name@example.com" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label small fw-semibold text-secondary">New Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control border-start-0" 
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" 
                                       placeholder="Min 6 characters" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmNewPassword" class="form-label small fw-semibold text-secondary">Confirm New Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                                <input type="password" id="confirmNewPassword" th:field="*{confirmNewPassword}" class="form-control border-start-0" 
                                       th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid'" 
                                       placeholder="Re-type new password" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3">
                            <i class="bi bi-key me-2"></i> Reset Password
                        </button>
                    </form>

                    <!-- Back to Login -->
                    <div class="text-center pt-3 border-top">
                        <p class="text-muted small mb-0">
                            Remember your credentials? 
                            <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none ms-1">Back to Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
