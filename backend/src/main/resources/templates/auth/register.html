<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Apex Bank</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-bg">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                <div class="card login-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="bi bi-bank2 fs-1 text-primary"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create an Account</h3>
                        <p class="text-muted small">Register your profile and open your Apex Bank account</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-2 fs-6"></i>
                        <span th:text="${errorMessage}">Registration failed. Please check the inputs.</span>
                    </div>

                    <!-- Registration Form -->
                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label for="name" class="form-label small fw-semibold text-secondary">Full Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="name" th:field="*{name}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" 
                                           placeholder="e.g. John Doe" required autofocus>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label small fw-semibold text-secondary">Email Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" 
                                           placeholder="name@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label small fw-semibold text-secondary">Phone Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" id="phone" th:field="*{phone}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" 
                                           placeholder="+1 555-0199" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="col-md-12">
                                <label for="address" class="form-label small fw-semibold text-secondary">Residential Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-muted"></i></span>
                                    <input type="text" id="address" th:field="*{address}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" 
                                           placeholder="123 Financial Way, Suite 100">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <div class="col-md-12">
                                <hr class="my-2">
                                <h6 class="fw-bold text-dark mb-1">Account & Credentials</h6>
                                <p class="text-muted small mb-3">Set up your username, initial deposit, and access password</p>
                            </div>

                            <div class="col-md-6">
                                <label for="username" class="form-label small fw-semibold text-secondary">Username *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
                                    <input type="text" id="username" th:field="*{username}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" 
                                           placeholder="Choose username" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="accountType" class="form-label small fw-semibold text-secondary">Account Type *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-wallet2 text-muted"></i></span>
                                    <select id="accountType" th:field="*{accountType}" class="form-select border-start-0" required>
                                        <option value="SAVINGS">Savings Account</option>
                                        <option value="CURRENT">Current / Checking Account</option>
                                    </select>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                            </div>

                            <div class="col-md-12">
                                <label for="initialDeposit" class="form-label small fw-semibold text-secondary">Initial Opening Deposit ($) *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-currency-dollar text-muted"></i></span>
                                    <input type="number" step="0.01" min="0" id="initialDeposit" th:field="*{initialDeposit}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('initialDeposit')} ? 'is-invalid'" 
                                           placeholder="0.00" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('initialDeposit')}" th:errors="*{initialDeposit}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="password" class="form-label small fw-semibold text-secondary">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" 
                                           placeholder="Min 6 characters" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" 
                                           placeholder="Re-type password" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3">
                                <i class="bi bi-person-plus me-2"></i> Register & Open Account
                            </button>
                        </div>
                    </form>

                    <!-- Back to Login -->
                    <div class="text-center pt-3 border-top">
                        <p class="text-muted small mb-0">
                            Already have an account? 
                            <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none ms-1">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
