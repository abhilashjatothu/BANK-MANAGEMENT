<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-bank sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
            <i class="bi bi-bank2 me-2 fs-4 text-warning"></i>
            <span>Apex Bank</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <!-- Admin Dashboard Link -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/dashboard/admin}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <!-- Employee Dashboard Link -->
                <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link" th:href="@{/dashboard/employee}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <!-- Customer Dashboard Link -->
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/dashboard/customer}">
                        <i class="bi bi-speedometer2 me-1"></i> My Portal
                    </a>
                </li>

                <!-- Customers Menu (Staff) -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'EMPLOYEE')">
                    <a class="nav-link" th:href="@{/customers}">
                        <i class="bi bi-people me-1"></i> Customers
                    </a>
                </li>

                <!-- Accounts Menu (All) -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/accounts}">
                        <i class="bi bi-wallet2 me-1"></i>
                        <span sec:authorize="hasAnyRole('ADMIN', 'EMPLOYEE')">Accounts</span>
                        <span sec:authorize="hasRole('CUSTOMER')">My Accounts</span>
                    </a>
                </li>

                <!-- Transactions Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="txDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-arrow-left-right me-1"></i> Banking Operations
                    </a>
                    <ul class="dropdown-menu shadow border-0" aria-labelledby="txDropdown">
                        <li><a class="dropdown-item" th:href="@{/transactions/deposit}"><i class="bi bi-arrow-down-circle text-success me-2"></i> Deposit</a></li>
                        <li><a class="dropdown-item" th:href="@{/transactions/withdraw}"><i class="bi bi-arrow-up-circle text-danger me-2"></i> Withdraw</a></li>
                        <li><a class="dropdown-item" th:href="@{/transactions/transfer}"><i class="bi bi-send text-primary me-2"></i> Fund Transfer</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/transactions/history}"><i class="bi bi-clock-history me-2"></i> Transaction History</a></li>
                    </ul>
                </li>

                <!-- Reports (Staff) -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'EMPLOYEE')">
                    <a class="nav-link" th:href="@{/reports/summary}">
                        <i class="bi bi-bar-chart-line me-1"></i> Reports
                    </a>
                </li>
            </ul>

            <!-- User Profile & Logout -->
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center py-1 px-3 rounded-pill" type="button" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-2 fs-5"></i>
                        <span sec:authentication="name" class="fw-semibold">User</span>
                        <span class="badge bg-warning text-dark ms-2" sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge bg-info text-dark ms-2" sec:authorize="hasRole('EMPLOYEE')">Staff</span>
                        <span class="badge bg-success ms-2" sec:authorize="hasRole('CUSTOMER')">Customer</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userMenuBtn">
                        <li class="dropdown-header">
                            <span class="text-muted small">Signed in as</span><br>
                            <strong sec:authentication="name">User</strong>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100 text-start">
                                    <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Not authenticated login button -->
            <div class="d-flex" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline-light rounded-pill px-4">Sign In</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
