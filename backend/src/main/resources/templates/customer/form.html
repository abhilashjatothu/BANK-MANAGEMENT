<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${isEdit ? 'Edit Customer' : 'Add Customer'} + ' - Apex Bank'">Customer Form</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card bank-card">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0">
                        <i class="bi me-2 text-primary" th:classappend="${isEdit ? 'bi-pencil-square' : 'bi-person-plus'}"></i>
                        <span th:text="${isEdit ? 'Edit Customer Profile' : 'Register New Customer'}">Customer Form</span>
                    </h4>
                    <a th:href="@{/customers}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to List
                    </a>
                </div>
                <div class="card-body p-4">
                    <form th:action="${isEdit ? '/customers/edit/' + customerForm.id : '/customers/new'}"
                          th:object="${customerForm}" method="post">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">1. Personal Information</h5>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="John Doe">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" id="email" th:field="*{email}" class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="john.doe@example.com">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="+1-555-0123">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label fw-semibold">Physical Address</label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="2"
                                      th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" placeholder="Street Address, City, State, ZIP"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address error</div>
                        </div>

                        <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">2. Online Banking Access (Optional)</h5>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold">Web Portal Username</label>
                                <input type="text" id="username" th:field="*{username}" class="form-control"
                                       th:readonly="${isEdit && customerForm.username != null}"
                                       placeholder="e.g. jdoe">
                                <small class="text-muted" th:if="${isEdit && customerForm.username != null}">Username cannot be modified.</small>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control"
                                       placeholder="Enter password">
                                <small class="text-muted" th:if="${isEdit}">Leave blank to retain current password.</small>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/customers}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${isEdit ? 'Save Changes' : 'Create Customer'}">Submit</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
